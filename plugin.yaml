name: databricks
version: 2.0.0
description: >
  Interact with Databricks workspaces via REST API: multi-workspace support,
  OAuth2 service-principal auth per workspace, Unity Catalog browsing
  (catalogs, schemas, tables, columns), SQL Statement API execution,
  and SQL warehouse management.
provides_tools:
  - databricks_list_workspaces
  - databricks_ping
  - databricks_list_catalogs
  - databricks_list_schemas
  - databricks_list_tables
  - databricks_get_schema
  - databricks_run_sql
  - databricks_list_warehouses
